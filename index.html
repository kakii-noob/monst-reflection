<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>アクセ生成サイト</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Reggae+One&display=swap');
:root{--safe-area-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;background:#111;color:#fff;font-family:"Reggae One","ComicReggae",-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100%;overflow:hidden;touch-action:manipulation}
body{display:block;position:relative}
button,input{font-family:inherit}
button{border:1px solid #3d4658;background:#242b38;color:#fff;border-radius:13px;height:56px;padding:0 14px;font-size:17px;font-weight:700;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.97)}
button.repeatPressed{background:#4a566b;border-color:#7f8da8;box-shadow:0 0 0 2px rgba(255,255,255,.12) inset}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar{position:fixed;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;left:50%;bottom:max(4px,env(safe-area-inset-bottom));transform:translateX(-50%) scale(var(--auto-menu-scale,1));transform-origin:bottom center;width:min(96vw,620px);max-width:calc(100vw - 8px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;background:#151820;z-index:20;background:rgba(21,24,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px}
#fileBtn{flex:1 1 190px;min-width:150px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#count{display:grid;grid-template-columns:56px 1fr 56px;gap:2px;flex:0 0 174px;align-items:center}
#count span{text-align:center;font-size:18px;font-weight:700;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}#count span .maxLabel{font-size:9px;line-height:9px;height:9px;font-weight:700}#count span small{font-size:9px;font-weight:500;line-height:10px;opacity:.8}#count span.max .num{color:#ff3b3b}#angleControls{display:flex;align-items:center;gap:3px;flex:0 0 auto}#angleDisplay{font-size:17px;opacity:.95;white-space:nowrap;min-width:76px;text-align:center}
#angleDisplay>span:first-child{font-size:9px;font-weight:500;line-height:10px;opacity:.8;display:block}#angleControls button{width:56px;min-width:56px;height:58px;padding:0;font-size:30px}
#minus,#plus{width:56px;min-width:56px;height:58px;padding:0;font-size:30px;touch-action:manipulation}
#zoomBtn{flex:0 0 100px;min-width:0;width:100%;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
#gaugeBtn{flex:0 0 58px;min-width:58px;width:58px;padding:0;font-size:20px}
#wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#111}
#stage{position:relative;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:none;transform-origin:center center}
#photo{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:16px;text-align:center;padding:30px;cursor:pointer}
#file{display:none}
#bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,174px) 100px;gap:7px;padding:8px}
#fileBtn{grid-column:1;grid-row:1/3;height:100%;min-width:0;width:100%;font-size:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{width:100%;min-width:0;grid-column:auto}
#zoomBtn{width:100%;min-width:0;padding:0 3px;font-size:17px;grid-column:3;grid-row:1}
#gaugeBtn{width:100%;min-width:0;padding:0;font-size:20px;grid-column:3;grid-row:2}
#angleControls{justify-content:center;grid-column:2;grid-row:2}
#angleDisplay{font-size:11px;opacity:.95;white-space:normal;min-width:56px;width:56px;text-align:center;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center}#angleDisplay .angleValue{font-size:12px;line-height:14px;font-weight:700}
@media(max-width:430px){
 #bar{grid-template-columns:minmax(0,1fr) 146px 82px;gap:5px;padding:6px}
 button{height:54px}
 #count{grid-template-columns:47px 1fr 47px;flex-basis:146px}
 #minus,#plus{width:47px;min-width:47px;height:54px;font-size:27px}#angleControls button{width:47px;min-width:47px;height:54px;font-size:27px}
 #zoomBtn{font-size:17px;padding:0 2px}
 #gaugeBtn{width:100%;min-width:0;font-size:20px;padding:0;grid-column:3;grid-row:2}
 #angleControls button{width:47px;min-width:47px;height:54px;font-size:27px}
 #angleDisplay{font-size:10px;min-width:46px;width:46px;height:54px}
}
html::before,html::after,body::before,body::after{content:none!important;display:none!important}
img,canvas,button,div,span{ -webkit-user-drag:none; }
input{ -webkit-touch-callout:none; }
#zoomBtn.active{background:#52677e}
#gaugeBtn.active{background:#52677e}

/* 画面中央に */
#gaugeOverlay{position:absolute;left:50%;top:50%;width:114px;height:32px;transform:translate(-50%,-50%) rotate(0deg);transform-origin:left center;pointer-events:none;z-index:15;display:none}
#gaugeOverlay.on{display:block}
#gaugeLine{position:absolute;left:0;top:50%;width:114px;height:20px;transform:translateY(-50%) scaleX(0);transform-origin:left center;border-radius:999px;background:rgba(255,255,255,.34);box-shadow:0 0 7px rgba(255,255,255,.12);}
#gaugeCore{position:absolute;left:0;top:50%;width:114px;height:2px;transform:translateY(-50%) scaleX(0);transform-origin:left center;background:rgba(255,255,255,.75);}
#gaugeCapStart,#gaugeCapEnd{position:absolute;top:50%;width:2px;height:30px;background:rgba(255,255,255,.78);transform:translateY(-50%) scaleY(0);transform-origin:center center}
#gaugeCapStart{left:0}.gaugeCapEnd{right:0}
#gaugeOverlay.animate #gaugeLine{animation:gaugePull .3s ease-out forwards}
#gaugeOverlay.animate #gaugeCore{animation:gaugePull .3s ease-out forwards}
#gaugeOverlay.animate #gaugeCapStart,#gaugeOverlay.animate #gaugeCapEnd{animation:gaugeCap .3s ease-out forwards}
@keyframes gaugePull{from{transform:translateY(-50%) scaleX(0)}to{transform:translateY(-50%) scaleX(1)}}
@keyframes gaugeCap{from{transform:translateY(-50%) scaleY(0)}to{transform:translateY(-50%) scaleY(1)}}

#voiceBtn{grid-column:1/-1;width:100%;height:42px;font-size:15px;padding:0 10px}
#voiceModal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px}
#voiceModal.open{display:flex}
#voiceModal .voiceCard{width:min(100%,420px);max-height:90vh;overflow:auto;background:#171c26;border:1px solid #465064;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0009}
#voiceModal h2{font-size:19px;margin:0 0 14px}
#voiceModal .voiceField{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#voiceModal #customDurationField{margin:0;gap:0}
#voiceModal label{font-size:13px;color:#d5dbe5}
#voiceModal input{width:100%;height:42px;border:1px solid #485367;border-radius:9px;background:#0e1219;color:#fff;padding:0 10px;font-size:16px;-webkit-user-select:text;user-select:text}
#voiceModal .durationOptions{display:grid;grid-template-columns:1fr;gap:8px;margin:0}
#voiceModal #customDurationField{margin:0;gap:0}
#voiceModal .durationOption{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #485367;border-radius:9px;background:#0e1219;cursor:pointer;font-size:14px}
#voiceModal .durationOption:has(input:checked){border-color:#4f91ff;background:#17263b}
#voiceModal .durationOption input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 20px;margin:0;border:1.5px solid #8793a6;border-radius:5px;background:#0e1219;display:grid;place-content:center}
#voiceModal .durationOption input:checked{background:#3985ff;border-color:#3985ff}
#voiceModal .durationOption input:checked::before{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);margin-top:-2px}
#voiceModal .voiceHint{font-size:12px;line-height:1.45;color:#b8c0ce;margin:10px 0}
#voiceModal .voiceActions{display:flex;gap:8px;margin-top:16px}
#voiceModal .voiceActions button{flex:1;height:46px;font-size:15px}
#voiceGenerate{background:#315a42;border-color:#4c8764}
.voiceInputRow{display:flex;align-items:stretch;gap:6px}.voiceInputRow input{flex:1;min-width:0}.voiceClear{width:44px;min-width:44px;padding:0;margin:0;border-radius:8px;background:#e8edf5;color:#1769d2;border:1px solid #c8d8ed;font-size:22px;font-weight:700;line-height:1}.voiceClear:active{background:#d4e3f7}.voiceInputRow input:focus{outline:2px solid #1684ff;outline-offset:1px}
#voiceBtn{grid-column:1/-1;grid-row:3}

</style>
</head>
<body>
<div id="bar">
  <button id="fileBtn" type="button">画像を選択</button>
  <input id="file" type="file" accept="image/*">
  <div id="count">
    <button id="minus">−</button><span id="n"><b class="maxLabel"></b><strong class="num">0</strong><small>反射</small></span><button id="plus">＋</button>
  </div>
  <button id="zoomBtn">拡大</button>
  <button id="gaugeBtn" type="button" aria-label="ガイド画像を保存">📸</button>
  <button id="voiceBtn" type="button">音声コントロールとして保存</button>
  <div id="angleControls"><button id="angleMinus">−</button><span id="angleDisplay"><span>角度</span><span class="angleValue">000.00°</span></span><button id="anglePlus">＋</button></div>
</div>

<div id="voiceModal" role="dialog" aria-modal="true" aria-labelledby="voiceTitle">
 <div class="voiceCard">
  <h2 id="voiceTitle">音声コマンドファイルを生成</h2>
  <p class="voiceHint">現在の角度のvoicecontrolcommandsファイルを生成します。読み上げ語句は「あ」や「1」などの音声コントロール上で設定することの出来ない4文字以下の語句を使用することもできます。もし追加して欲しい機能あったらDMください。</p>
  <div id="voiceNoticeWrap" style="overflow: hidden; width: 100%; margin-top: 8px;">
  <style>
    @keyframes voiceMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
  <p id="voiceNoticeText" style="color: #ff4d4d; font-weight: bold; font-size: 12px; margin: 0; line-height: 1.45;">※注意※角度によって生成した角度から0.0？°程ズレが生じる不具合を確認。</p>
</div>
  <div class="voiceField">
   <label>なぞるのにかける時間</label>
   <div class="durationOptions" role="radiogroup" aria-label="なぞるのにかける時間">
    <label class="durationOption"><input type="radio" name="voiceDurationMode" value="rapid" checked><span>速射（0.01秒）</span></label>
    <label class="durationOption"><input type="radio" name="voiceDurationMode" value="gauge"><span>ゲージ（0.5秒）</span></label>
   </div>
   <div class="voiceField" id="customDurationField"><input id="voiceDuration" type="number" min="0.01" max="10" step="0.001" value="" placeholder="タップして入力（秒）" aria-label="自由入力（秒）"></div>
  </div>
  <div class="voiceField"><label for="voiceCommandName">読み上げ語句（何も入力しない場合は1になります）</label><input id="voiceCommandName" type="text" maxlength="80" value="" placeholder="タップして入力"></div>
  <div class="voiceField"><label for="voiceFileName">ファイル名</label><input id="voiceFileName" type="text" maxlength="100" value="" placeholder="タップして入力" autocomplete="off"></div>
   <div class="voiceActions"><button id="voiceCancel" type="button">キャンセル</button><button id="voiceGenerate" type="button">保存</button></div>
  <!-- 既存ファイル一括変換エリア -->
  <div style="border-top: 1px solid #3d4658; margin-top: 16px; padding-top: 14px;">
    <h3 style="font-size: 15px; margin: 0 0 6px; color: #fff;">既存ファイルを一括変換</h3>
    <p class="voiceHint" style="margin: 0 0 10px;">お手持ちの voicecontrolcommands ファイル内の全コマンドを上記で選択した時間（速射/ゲージ等）に一括変換します。</p>
    <button id="voiceConvertBtn" type="button" style="width: 100%; height: 44px; font-size: 14px; background: #2c3c54; border-color: #4a6285;">既存ファイルを選択して変換・保存</button>
    <input id="voiceConvertFile" type="file" accept=".voicecontrolcommands" style="display: none;">
  </div>


 </div>
</div>
<div id="wrap">
  <div id="gaugeOverlay" aria-hidden="true"><div id="gaugeLine"></div><div id="gaugeCore"></div><div id="gaugeCapStart"></div><div id="gaugeCapEnd" class="gaugeCapEnd"></div></div>
  <div id="empty">画像を選択</div>
  <div id="stage" hidden>
    <img id="photo" alt="">
    <canvas id="cv"></canvas>
  </div>
</div>
<script>
const file=document.getElementById('file'), fileBtn=document.getElementById('fileBtn');
const stage=document.getElementById('stage'), photo=document.getElementById('photo'), cv=document.getElementById('cv');
const ctx=cv.getContext('2d'), empty=document.getElementById('empty');
const nEl=document.getElementById('n'), plus=document.getElementById('plus'), minus=document.getElementById('minus'), hide=document.getElementById('hide');

let reflections=3, imgW=0,imgH=0; let zoomMode=false, zoomScale=1, zoomStartDist=0, zoomStartScale=1;
let cursor={x:0,y:0}; // image coordinates
// pullAngle is the direction from the ball toward the tapped/released position.
let pullAngle=-Math.PI/2;
let active=null, lastX=0,lastY=0;
let touchStartX=0,touchStartY=0;

fileBtn.onclick=()=>file.click();
empty.onclick=()=>{ if(stage.hidden) file.click(); };
file.onchange=e=>{
 const f=e.target.files?.[0]; if(!f)return;
 const url=URL.createObjectURL(f);
 // Remember the most recently selected image for the ⚡︎ button.
 photo.onload=()=>{
   if(imgW>0 && imgH>0){
     window._cursorRelX=cursor.x/imgW;
     window._cursorRelY=cursor.y/imgH;
   }
   imgW=photo.naturalWidth; imgH=photo.naturalHeight;
   stage.hidden=false; empty.hidden=true;
   fitStage();
   // 画像を変更してもカーソルの現在位置と角度を維持
   const b=bounds();
   if(typeof window._cursorRelX==='number' && typeof window._cursorRelY==='number'){
     cursor.x=Math.max(0,Math.min(imgW,window._cursorRelX*imgW));
     cursor.y=Math.max(0,Math.min(imgH,window._cursorRelY*imgH));
   }else{
     cursor.x=(b.l+b.r)/2; cursor.y=(b.t+b.b)/2;
   }
   updateAngleUI();
   draw();
   updateBarScale();
 };
 photo.src=url;
};

function fitStage(){
 const wrapW=document.getElementById('wrap').clientWidth;
 const wrapH=document.getElementById('wrap').clientHeight;
 const scale=Math.min(wrapW/imgW,wrapH/imgH);
 stage.style.width=Math.round(imgW*scale)+'px';
 stage.style.height=Math.round(imgH*scale)+'px';
 cv.width=imgW; cv.height=imgH;
}
window.addEventListener('resize',()=>{if(!stage.hidden){fitStage();draw();}requestAnimationFrame(updateBarScale);});

function bounds(){
   const topY = 299;
   const bottomY = 1030;
   const leftX = 54;
   const rightX = 1111;
  // 1. マスター環境（iPhone 14想定）の解像度
  const baseW = 1170;
  const baseH = 2532;
  const oldRefH = 1536;

  // 2. 完璧な数値から、ベース環境での絶対座標を算出
  const uL = leftX;
  const uR = rightX;
  const uT = (topY / oldRefH) * baseH;
  const uB = (bottomY / oldRefH) * baseH;

  const baseBoxW = uR - uL;
  const baseBoxH = uB - uT;

  // 位置ズレ解消の鍵：「画面のど真ん中」からどれだけズレているかを計算
  const baseCenterX = (uL + uR) / 2;
  const baseCenterY = (uT + uB) / 2;
  const offsetX = (baseW / 2) - baseCenterX; // 中心からのXズレ
  const offsetY = (baseH / 2) - baseCenterY; // 中心からのYズレ（上にズレている分）

  // 3. 読み込んだ画像のアスペクト比判定（16:9を基準とする）
  const thresholdAspect = 16 / 9;
  const imgAspect = imgH / imgW;

  let scale;
  if (imgAspect >= thresholdAspect) {
    // 縦長スマホ (iPhone 14, SEなど)
    scale = imgW / baseW;
  } else {
    // 横広タブレット (iPadなど)
    const virtualW = imgH / thresholdAspect;
    scale = virtualW / baseW;
  }

  // 4. 最終的な盤面のサイズ（ここは前回と同じ完璧なサイズ）
  const currentW = baseBoxW * scale;
  const currentH = baseBoxH * scale;

  // 5. 各端末の「画面のど真ん中」を基準に、スケールされたズレ分を適用して配置
  const currentCX = (imgW / 2) - (offsetX * scale);
  const currentCY = (imgH / 2) - (offsetY * scale);

  return {
    l: Math.max(0, currentCX - currentW / 2),
    r: Math.min(imgW, currentCX + currentW / 2),
    t: Math.max(0, currentCY - currentH / 2),
    b: Math.min(imgH, currentCY + currentH / 2)
  };
}
function updateBarScale(){
 const bar=document.getElementById('bar');
 if(!bar)return;
 // Measure the unscaled menu so repeated resize events do not compound scaling.
 const naturalHeight=bar.offsetHeight;
 if(!naturalHeight)return;
 let availableHeight=window.innerHeight*0.88;
 if(!stage.hidden && imgW && imgH){
   const b=bounds();
   const stageRect=stage.getBoundingClientRect();
   const wallBottomOnScreen=stageRect.top+(b.b/imgH)*stageRect.height;
   const safeBottom=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-bottom'))||0;
   availableHeight=window.innerHeight-wallBottomOnScreen-safeBottom-12;
 }
 // Leave a small margin below the wall and never enlarge beyond the iPhone 14 baseline.
 const scale=Math.max(0.1,Math.min(1,(availableHeight*0.90)/naturalHeight));
 bar.style.setProperty('--auto-menu-scale',String(scale));
}

function draw(){
 if(!imgW)return;
 ctx.clearRect(0,0,imgW,imgH);
 const b=bounds();
 drawReflection(b);
 drawCursor();
}

function drawCursor(){
 const x=cursor.x,y=cursor.y;
 const b=bounds();
 const s=(b.r-b.l)/1057;
 const R=68*s;
 const rg=ctx.createRadialGradient(x,y,R*.15,x,y,R*1.75);
 rg.addColorStop(0,'rgba(255,150,35,.48)');
 rg.addColorStop(.45,'rgba(255,115,20,.28)');
 rg.addColorStop(1,'rgba(255,90,10,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,R*1.75,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,105,15,.13)';ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,95,15,.95)';ctx.lineWidth=7*s;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(255,225,145,.82)';ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(x,y,R+6*s,0,Math.PI*2);ctx.stroke();
 const L=145*s, gap=R+7*s;
 for(let i=0;i<4;i++){
   const a=pullAngle + Math.PI/4 + i*Math.PI/2;
   const x1=x+Math.cos(a)*gap,y1=y+Math.sin(a)*gap;
   const x2=x+Math.cos(a)*(gap+L),y2=y+Math.sin(a)*(gap+L);
   ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=42*s;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=30*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.58)';ctx.beginPath();ctx.arc(x2,y2,17*s,0,Math.PI*2);ctx.fill();
 }
}

function rayToSegment(px,py,dx,dy,x1,y1,x2,y2){
 const sx=x2-x1,sy=y2-y1;
 const den=dx*sy-dy*sx;
 if(Math.abs(den)<1e-9)return null;
 const t=((x1-px)*sy-(y1-py)*sx)/den;
 const u=((x1-px)*dy-(y1-py)*dx)/den;
 if(t>1e-7 && u>=0 && u<=1)return {t,u,x:px+dx*t,y:py+dy*t};
 return null;
}
function reflectPath(b){
 // Shoot directly toward the tapped/released position.
 let x=cursor.x,y=cursor.y;
 let dx=Math.cos(pullAngle),dy=Math.sin(pullAngle);
 // angle is the travel direction.
 const pts=[{x,y}];
 for(let k=0;k<reflections;k++){
   const hits=[
    rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
    rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
    rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
    rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
   ].filter(Boolean).sort((a,c)=>a.t-c.t);
   if(!hits.length)break;
   const h=hits[0]; pts.push({x:h.x,y:h.y});
   // A corner hits both axes; nearby single-wall hits must stay distinct.
   if(Math.abs(h.x-b.l)<1e-7||Math.abs(h.x-b.r)<1e-7) dx=-dx;
   if(Math.abs(h.y-b.t)<1e-7||Math.abs(h.y-b.b)<1e-7) dy=-dy;
   // rayToSegment ignores t=0, so no nudge that could skip a nearby wall is needed.
   x=h.x;y=h.y;
 }
 // Continue last segment to boundary/long distance.
 let ex=x+dx*Math.max(imgW,imgH)*2, ey=y+dy*Math.max(imgW,imgH)*2;
 const last= [
   rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
   rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
   rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),

  if(!content)throw new Error('座標を元データの領域内に格納できません');
  const padded=content.slice(0,-1)+' '.repeat(p.length-content.length)+'}';
  bytes.set(new TextEncoder().encode(padded),p.offset);
 });
 const t0=voiceGestureTimes[0].value,tLast=voiceGestureTimes[voiceGestureTimes.length-1].value;
 const factor=durationSec/Math.max(.001,tLast-t0);
 const view=new DataView(bytes.buffer);
 voiceGestureTimes.forEach(t=>view.setFloat64(t.offset,t0+(t.value-t0)*factor,false));
 return voiceDataToBase64(bytes);
}
document.getElementById('voiceGenerate').addEventListener('click',()=>{
 try{
  const deviceProfile=getVoiceDeviceProfile();
  const lengthPx=deviceProfile.lengthPx;
  const deviceScale=deviceProfile.deviceScale;
  const customDurationValue=document.getElementById('voiceDuration').value.trim();
  const durationMode=durationModeInputs.find(input=>input.checked)?.value||'rapid';
  const durationSec=customDurationValue!==''?Number(customDurationValue):(durationMode==='gauge'?.5:.01);
  const commandName=document.getElementById('voiceCommandName').value.trim()||'1';
  let fileName=document.getElementById('voiceFileName').value.trim().replace(/[\\/:*?"<>|]/g,'-');
  if(!Number.isFinite(durationSec)||durationSec<.01||durationSec>10)throw new Error('時間は0.01〜10秒の範囲で入力してください。');
  if(!fileName)fileName=getDefaultVoiceFileName();
  const gesture=makeVoiceGesture(lengthPx,durationSec,deviceScale);
  const now=new Date();const iso=now.toISOString().replace(/\.\d{3}Z$/,'Z');
  const appleDate=Date.now()/1000-978307200;
  const id=`Custom.${Math.floor(Date.now()/1000)}.${Math.floor(Math.random()*900000+100000)}`;
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>CommandsTable</key><dict><key>${id}</key><dict><key>ConfirmationRequired</key><false/><key>CustomCommands</key><dict><key>ja_JP</key><array><string>${voiceXmlEscape(commandName)}</string></array></dict><key>CustomGesture</key><data>${gesture}</data><key>CustomModifyDate</key><date>${iso}</date><key>CustomScope</key><string>com.apple.speech.SystemWideScope</string><key>CustomType</key><string>RunGesture</string></dict></dict><key>ExportDate</key><real>${appleDate}</real><key>SystemVersion</key><dict>${Object.entries(voiceSystemVersion).map(([k,v])=>`<key>${voiceXmlEscape(k)}</key><string>${voiceXmlEscape(v)}</string>`).join('')}</dict></dict></plist>`;
  const blob=new Blob([xml],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName.toLowerCase().endsWith('.voicecontrolcommands')?fileName:fileName+'.voicecontrolcommands';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);voiceModal.classList.remove('open');
 }catch(err){alert(err.message||'ファイル生成に失敗しました。')}
});
// 2. 既存バイナリから角度を取り出して新規テンプレートで一括打ち直しする処理（角度軸修正版）
function convertGestureDuration(b64, durationSec, lengthPx, deviceScale){
  try{
    const raw = atob(b64.trim());
    // Generated NSPoint strings are padded with spaces before the closing brace.
    const matches = [...raw.matchAll(/\{\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)\s*\}/g)];
    if(!matches || matches.length < 2) throw new Error('ジェスチャーの座標を読み取れませんでした。');
    
    // 実際のファイルデータから「始点」と「終点」を取得
    const startX = parseFloat(matches[0][1]);
    const startY = parseFloat(matches[0][2]);
    const endX = parseFloat(matches[matches.length - 1][1]);
    const endY = parseFloat(matches[matches.length - 1][2]);
    
    const dx = endX - startX;
    const dy = endY - startY;
    
    // ジェスチャ作成関数の内部計算（-Math.PI）と打ち消し合って100%同じ角度になるよう調整
    const extractedPullAngle = Math.atan2(dy, dx) + Math.PI;

    return makeVoiceGesture(lengthPx, durationSec, deviceScale, extractedPullAngle);
  }catch(e){
    throw e;
  }
}
// 3. ファイル選択イベント処理
const voiceConvertBtn = document.getElementById('voiceConvertBtn');
const voiceConvertFile = document.getElementById('voiceConvertFile');

if(voiceConvertBtn && voiceConvertFile){
  voiceConvertBtn.addEventListener('click', ()=>{
    voiceConvertFile.value = '';
    voiceConvertFile.click();
  });

  voiceConvertFile.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if(!file) return;

    const deviceProfile = getVoiceDeviceProfile();
    const lengthPx = deviceProfile.lengthPx;
    const deviceScale = deviceProfile.deviceScale;

    const customDurationValue = document.getElementById('voiceDuration').value.trim();
    const durationMode = durationModeInputs.find(input => input.checked)?.value || 'rapid';
    const durationSec = customDurationValue !== '' ? Number(customDurationValue) : (durationMode === 'gauge' ? 0.5 : 0.01);

    if(!Number.isFinite(durationSec) || durationSec < 0.01 || durationSec > 10){
      alert('時間は0.01〜10秒の範囲で設定してください。');
      return;
    }

    let suffix = '_converted';
    if(customDurationValue !== ''){
      suffix = `_${durationSec}s`;
    }else if(durationMode === 'gauge'){
      suffix = '_ゲージ';
    }else if(durationMode === 'rapid'){
      suffix = '_速射';
    }

    const reader = new FileReader();
    reader.onload = evt => {
      try{
        const xmlText = evt.target.result;
        let convertedCount = 0;
        const convertedXml = xmlText.replace(/<key>CustomGesture<\/key>\s*<data>([\s\S]*?)<\/data>/g, (match, b64) => {
          convertedCount++;
          return `<key>CustomGesture</key><data>${convertGestureDuration(b64, durationSec, lengthPx, deviceScale)}</data>`;
        });
        if(convertedCount === 0) throw new Error('ファイル内にCustomGestureが見つかりませんでした。');

        const blob = new Blob([convertedXml], {type: 'application/octet-stream'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const originalName = file.name.replace(/\.voicecontrolcommands$/i, '');
        a.download = `${originalName}${suffix}.voicecontrolcommands`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        voiceModal.classList.remove('open');
      }catch(err){
        alert('ファイルの変換に失敗しました。ファイル形式をご確認ください。');
      }
    };
    reader.readAsText(file);
  });
}
